name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install dependencies
        run: npm install
      - name: Build mobile web engine
        run: npm run build
      - name: Generate Android wrapper
        run: npx cap add android
      - name: Sync and compile debug APK
        run: |
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:screenOrientation="unspecified"', 'android:screenOrientation="landscape"')
          s = s.replace('android:screenOrientation="portrait"', 'android:screenOrientation="landscape"')
          if 'android:screenOrientation=' not in s:
              s = s.replace('<activity ', '<activity android:screenOrientation="landscape" ', 1)
          p.write_text(s)
          print('Manifest orientation set to landscape')
          PY
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobiForge3D-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish public APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: MobiForge 3D v0.1.1 (orientación horizontal)
          body: 'Corrección de inicio del visor 3D y orientación horizontal. APK de depuración; prototipo inicial, no publicación de producción.'
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          fail_on_unmatched_files: true
